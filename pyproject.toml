[project]
name = "ai-news-reporter"
version = "0.1.0"
description = "Daily Korean and global AI news intelligence report"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "deep-translator>=1.11",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
ai-news = "ai_news.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]